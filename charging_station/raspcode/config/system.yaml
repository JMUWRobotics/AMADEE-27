mppt_pin: 02
power_supply_pin: 03

bus:
  max_voltage: 60
  max_current: 32
  min_voltage: 48
  min_current: 0

dpm:
  max_voltage: 60
  max_current: 32
  min_voltage: 48
  min_current: 0

adapter:
  dpm_tty_port: /dev/ttyUSB1
  dpm_baudrate: 9600
  dpm_protocol: simple
  dpm_stale_time: 1
  mfrc_spi_bus: 1
  mfrc_baudrate: 100000
  mfrc_pin_rst: 32
  devices:
    -
      gpio_pin: 2
      dpm_address: 10
      max_voltage: 60
      mfrc_chip_select: 0
    -
      gpio_pin: 3
      dpm_address: 11
      max_voltage: 45
      mfrc_chip_select: 1
    -
      gpio_pin: 4
      dpm_address: 12
      max_voltage: 45
      mfrc_chip_select: 2

mppt:
  device: smartsolar_150_35
  tty_port: /dev/ttyUSB0
  timeout: 60
  serial_test:
    PID_test:
      typeTest: value
      key: PID
      value: 0xAO58


  




